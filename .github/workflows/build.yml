name: Build Waifly Dependencies

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean old install
        run: |
          rm -rf node_modules package-lock.json

      - name: Install 26.2 stack
        run: npm install --omit=dev --no-audit --no-fund

      - name: Verify actual protocol package
        run: |
          node - <<'NODE'
          const path = require.resolve('minecraft-protocol/package.json')
          const p = require(path)

          console.log('minecraft-protocol path:', path)
          console.log('minecraft-protocol version:', p.version)

          const mf = require('mineflayer/package.json')
          console.log('mineflayer version:', mf.version)

          require('mineflayer')
          require('mineflayer-pathfinder')
          require('minecraft-protocol')
          require('vec3')

          console.log('Dependencies OK')
          NODE

      - name: Check for duplicate protocol copies
        run: |
          npm ls minecraft-protocol || true

      - name: Create dependency archive
        run: tar -czf node_modules.tar.gz node_modules

      - name: Upload dependency archive
        uses: actions/upload-artifact@v4
        with:
          name: waifly-node-modules
          path: node_modules.tar.gz
          compression-level: 0
